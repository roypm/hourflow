name: Android

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version_name=$(sed -n 's/^VERSION_NAME=\(.*\)$/\1/p' gradle.properties | head -n 1)
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "${version_name}" ]]; then
            echo "VERSION_NAME is missing from gradle.properties" >&2
            exit 1
          fi

          if [[ "${version_name}" != "${tag_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME ${version_name}" >&2
            exit 1
          fi

      - name: Build validation APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew :app:assembleDebug

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease

      - name: Prepare validation artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HourFlow-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Prepare release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          version_name=$(sed -n 's/^VERSION_NAME=\(.*\)$/\1/p' gradle.properties | head -n 1)
          cp app/build/outputs/apk/release/app-release.apk "dist/HourFlow-${version_name}.apk"

      - name: Upload validation artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: hourflow-debug-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: hourflow-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${release_notes_path}" ]]; then
            echo "Missing release notes file: ${release_notes_path}" >&2
            exit 1
          fi

          cat > release-notes.md <<'EOF'
          ## Installation

          Before installing this APK, export a JSON backup from Settings.

          If Android does not allow the previous version to be updated because the APK signing key is different:

          1. Export the JSON backup.
          2. Uninstall HourFlow.
          3. Install the downloaded APK.
          4. Open Settings and import the JSON backup.

          EOF

          printf '\n' >> release-notes.md
          cat "${release_notes_path}" >> release-notes.md

          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS.txt \
            --title "HourFlow ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes
